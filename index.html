<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker & Trophy Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --dark-bg: #0f0e17;
            --darker-bg: #0a0a12;
            --card-bg: #16151e;
            --card-border: #2a2938;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --bronze: #cd7f32;
            --silver: #c0c0c0;
            --gold: #ffd700;
            --mythic: #ff1493;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html.dark {
            background: linear-gradient(135deg, #0f0e17 0%, #1a1626 50%, #0f0e17 100%);
            background-attachment: fixed;
            color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Trebuchet MS', sans-serif;
            background-color: var(--dark-bg);
            color: #e5e7eb;
            overflow-x: hidden;
        }

        /* Smooth animations */
        .transition-fade { transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(12px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-bg { 
            background-color: var(--card-bg); 
            border: 1px solid var(--card-border);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .card-hover { transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .card-hover:hover { 
            background-color: #1f1d2a;
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
        }

        .accent-btn { 
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .accent-btn:hover { 
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
        }

        /* ===== PLAYING CARD STYLES ===== */
        .playing-card {
            aspect-ratio: 2.5 / 3.5;
            background-color: #f5f5f5;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.4));
        }

        .playing-card:hover {
            transform: translateY(-16px) rotateZ(0deg) scale(1.05);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
            filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.6));
        }

        .playing-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
            transform: rotate(45deg);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .playing-card:hover::before {
            opacity: 1;
            animation: shimmer 0.6s ease-in-out;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        /* Rarity card styles */
        .playing-card.bronze {
            background: linear-gradient(135deg, #f4e4c1 0%, #e8d4b0 50%, #d4b896 100%);
            border: 2px solid #cd7f32;
        }

        .playing-card.silver {
            background: linear-gradient(135deg, #f8f8f8 0%, #e8e8e8 50%, #d8d8d8 100%);
            border: 2px solid #a8a8a8;
            box-shadow: 0 10px 40px rgba(192, 192, 192, 0.3), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .playing-card.gold {
            background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 50%, #f59e0b 100%);
            border: 2px solid #d97706;
            box-shadow: 0 10px 40px rgba(217, 119, 6, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.4),
                        0 0 30px rgba(217, 119, 6, 0.2);
            animation: gold-pulse 2s ease-in-out infinite;
        }

        .playing-card.gold:hover {
            box-shadow: 0 30px 60px rgba(217, 119, 6, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4),
                        0 0 50px rgba(217, 119, 6, 0.4);
            animation: none;
            transform: translateY(-16px) rotateZ(0deg) scale(1.08);
        }

        @keyframes gold-pulse {
            0%, 100% {
                box-shadow: 0 10px 40px rgba(217, 119, 6, 0.4), 
                            inset 0 1px 0 rgba(255, 255, 255, 0.4),
                            0 0 30px rgba(217, 119, 6, 0.2);
            }
            50% {
                box-shadow: 0 10px 40px rgba(217, 119, 6, 0.5), 
                            inset 0 1px 0 rgba(255, 255, 255, 0.4),
                            0 0 50px rgba(217, 119, 6, 0.4);
            }
        }

        .playing-card.mythic {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 25%, #ba55d3 50%, #9370db 75%, #ff1493 100%);
            background-size: 400% 400%;
            animation: holographic 4s ease infinite, mythic-dance 3s ease-in-out infinite;
            border: 2px solid #ff1493;
            box-shadow: 0 10px 40px rgba(255, 20, 147, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.3),
                        0 0 40px rgba(255, 20, 147, 0.3);
        }

        .playing-card.mythic:hover {
            box-shadow: 0 30px 60px rgba(255, 20, 147, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3),
                        0 0 60px rgba(255, 20, 147, 0.5);
            animation: none;
            transform: translateY(-16px) rotateZ(0deg) scale(1.09);
        }

        @keyframes mythic-dance {
            0%, 100% {
                transform: translateY(0) rotateZ(-0.5deg);
            }
            25% {
                transform: translateY(-8px) rotateZ(0.5deg);
            }
            50% {
                transform: translateY(0) rotateZ(-0.5deg);
            }
            75% {
                transform: translateY(-8px) rotateZ(0.5deg);
            }
        }

        /* Legendary Master Set Cards - Ultimate Rarity */
        .playing-card.legendary {
            background: linear-gradient(135deg, #000428 0%, #004e92 25%, #1a7fa0 50%, #004e92 75%, #000428 100%);
            background-size: 400% 400%;
            animation: legendaryShimmer 3s ease infinite;
            border: 3px solid #00d4ff;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.4),
                        0 0 60px rgba(0, 212, 255, 0.4),
                        0 0 100px rgba(0, 212, 255, 0.2);
            position: relative;
        }

        .playing-card.legendary::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, transparent 30%, rgba(0, 212, 255, 0.3), transparent 70%);
            border-radius: 16px;
            animation: legendary-shine 3s infinite;
            pointer-events: none;
        }

        .playing-card.legendary:hover {
            box-shadow: 0 30px 70px rgba(0, 212, 255, 1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.5),
                        0 0 80px rgba(0, 212, 255, 0.8),
                        0 0 150px rgba(0, 212, 255, 0.4);
            transform: translateY(-16px) rotateZ(0deg) scale(1.1);
            filter: drop-shadow(0 30px 60px rgba(0, 212, 255, 0.6));
        }

        @keyframes legendaryShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes legendary-shine {
            0% { 
                transform: translateX(-100%);
            }
            50% { 
                transform: translateX(100%);
            }
            100% { 
                transform: translateX(100%);
            }
        }

        @keyframes holographic {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-corner {
            position: absolute;
            font-size: 11px;
            font-weight: 900;
            line-height: 1;
            pointer-events: none;
            color: #333;
        }

        .card-corner.top-left { top: 8px; left: 8px; }
        .card-corner.bottom-right { bottom: 8px; right: 8px; transform: rotate(180deg); }

        .card-suit {
            font-size: 14px;
            margin: 0 2px;
        }

        /* Fix text contrast on light card backgrounds */
        .playing-card.silver .card-corner,
        .playing-card.silver .card-suit,
        .playing-card.bronze .card-corner,
        .playing-card.bronze .card-suit {
            color: #0f0e17;
        }

        .playing-card.gold .card-corner,
        .playing-card.gold .card-suit,
        .playing-card.silver .text-xs,
        .playing-card.bronze .text-xs,
        .playing-card.gold .text-xs {
            color: #0f0e17;
        }

        .playing-card.silver .text-3xl,
        .playing-card.bronze .text-3xl,
        .playing-card.gold .text-3xl {
            opacity: 0.6;
        }

        .playing-card.mythic .card-corner,
        .playing-card.mythic .card-suit,
        .playing-card.legendary .card-corner,
        .playing-card.legendary .card-suit {
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: linear-gradient(135deg, var(--card-bg) 0%, #1f1d2a 100%);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            z-index: 40;
            animation: slideIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            backdrop-filter: blur(10px);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        /* Fanned Deck Spread */
        .deck-spread {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: -20px;
            padding: 40px 20px;
            perspective: 1200px;
        }

        .deck-card {
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), z-index 0.3s ease;
        }

        .deck-card:hover {
            transform: translateY(-50px) rotateZ(0deg) !important;
            z-index: 1000 !important;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            background: linear-gradient(135deg, var(--card-bg) 0%, #1f1d2a 100%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            animation: slideUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        }

        @keyframes slideUp {
            from { 
                transform: translateY(40px); 
                opacity: 0; 
            }
            to { 
                transform: translateY(0); 
                opacity: 1; 
            }
        }

        .inline-edit {
            padding: 8px 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #e5e7eb;
            font-size: inherit;
            transition: all 0.2s ease;
        }

        .inline-edit:focus {
            outline: none;
            border-color: var(--accent);
            background-color: rgba(59, 130, 246, 0.15);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .progress-bar {
            height: 8px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            transition: width 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .progress-fill.updating {
            animation: progressPulse 0.6s ease-out;
        }

        @keyframes progressPulse {
            0% {
                box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            }
            50% {
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.8), 0 0 30px rgba(100, 200, 255, 0.6);
            }
            100% {
                box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            }
        }

        /* Button styling and animations */
        .increment-btn, .decrement-btn, .plus-five-btn, .complete-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: 1px solid #3b82f6;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        .increment-btn:hover, .decrement-btn:hover, .plus-five-btn:hover, .complete-btn:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            border-color: #60a5fa;
        }

        .increment-btn:active, .decrement-btn:active, .plus-five-btn:active, .complete-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        /* Button ripple effect */
        .increment-btn::before, .decrement-btn::before, .plus-five-btn::before, .complete-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .increment-btn:active::before, .decrement-btn:active::before, .plus-five-btn:active::before, .complete-btn:active::before {
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            to {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }

        /* Header and Nav */
        .header-gradient {
            background: linear-gradient(135deg, var(--darker-bg) 0%, #1a1626 50%, var(--darker-bg) 100%);
            border-bottom: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .nav-tab {
            position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            color: #9ca3af;
        }

        .nav-tab.active {
            color: var(--accent);
        }

        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            border-radius: 2px;
            animation: slideInUp 0.3s ease-out;
        }

        /* Rarity badges */
        .rarity-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .rarity-badge.bronze {
            background: linear-gradient(135deg, #cd7f32 0%, #a85a1f 100%);
            color: #f9f5f0;
            box-shadow: 0 4px 15px rgba(205, 127, 50, 0.3);
        }

        .rarity-badge.silver {
            background: linear-gradient(135deg, #c0c0c0 0%, #808080 100%);
            color: #0f0e17;
            box-shadow: 0 4px 15px rgba(192, 192, 192, 0.3);
        }

        .rarity-badge.gold {
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%);
            color: #0f0e17;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
        }

        .rarity-badge.mythic {
            background: linear-gradient(135deg, #ff1493 0%, #ba55d3 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.5);
            animation: glow 2s ease-in-out infinite;
        }

        .rarity-badge.legendary {
            background: linear-gradient(135deg, #00d4ff 0%, #0088cc 50%, #004e92 100%);
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.6);
            animation: legendary-glow 2s ease-in-out infinite;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 4px 15px rgba(255, 20, 147, 0.5); }
            50% { box-shadow: 0 4px 25px rgba(255, 20, 147, 0.8); }
        }

        @keyframes legendary-glow {
            0%, 100% { box-shadow: 0 4px 20px rgba(0, 212, 255, 0.6); }
            50% { box-shadow: 0 4px 30px rgba(0, 212, 255, 1); }
        }

        /* Celebratory animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes scale-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .celebration-popup {
            animation: bounce 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), scale-pulse 0.6s ease-in-out;
        }

        /* Trophy grid */
        .trophy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            padding: 16px;
        }

        .trophy-item {
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            animation: fadeIn 0.5s ease-out;
        }

        .trophy-item:hover {
            transform: scale(1.08) translateY(-8px);
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.5));
        }

        /* Stat cards */
        .stat-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(37, 99, 235, 0.05) 100%);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(37, 99, 235, 0.1) 100%);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-4px);
        }

        /* Button enhancements */
        button {
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div id="app" class="flex flex-col min-h-screen"></div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        // ========== STATE MANAGEMENT & PERSISTENCE ==========
        const STATE_KEY = 'progressTracker:state:v1';
        const LAST_VISIT_KEY = 'progressTracker:lastVisit:v1';

        const DEFAULT_STATE = {

                                { id: 's4-3', name: '4.3 Oligopoly', completed: 0, total: 4, trophyAwarded: false, completedAt: null, updatedAt: new Date().toISOString() },
                                { id: 's4-4', name: '4.4 Monopoly', completed: 0, total: 6, trophyAwarded: false, completedAt: null, updatedAt: new Date().toISOString() },

                        },
                        {
                            id: 'unit-5',

                loaded.lastSessionAt = prevVisit || null;

        // ========== TROPHY & POINTS LOGIC ==========
        function getRarityForQuestionCount(count) {
            if (count >= 7) return 'gold';
            if (count >= 4) return 'silver';
            return 'bronze';
        }

        function getRankForRarity(rarity, count) {
            if (rarity === 'bronze') {
                const val = Math.min(count, 3);
                return ['I', 'II', 'III'][val - 1];
            }
            if (rarity === 'silver') return 'Q';
            if (rarity === 'gold') return 'K';
            if (rarity === 'mythic') return '♛';
            return 'MS';
        }

        function getSuitForRarity(rarity) {
            if (rarity === 'bronze') return '♣';
            if (rarity === 'silver') return '◆';
            if (rarity === 'gold') return '♠';
            if (rarity === 'mythic') return '♛';
            return '👑';
        }

            return state.unlockedTrophies.reduce((sum, t) => sum + t.points, 0);

            if (section.trophyAwarded || section.completed < section.total || section.total === 0) return;

            const trophy = {

                rarity,
                title: section.name,
                masterSetId,
                masterSetTitle,
                categoryName,
                points: section.total,
                earnedAt: new Date().toISOString(),
                rank: getRankForRarity(rarity, section.total),
                suit: getSuitForRarity(rarity)
            };
            state.unlockedTrophies.push(trophy);
            showToast(`🏆 Earned ${rarity.toUpperCase()} Trophy!`);
        }

            if (masterSet.completedAwarded) return;

        // ========== CALCULATION HELPERS ==========
        function calculateMasterSetTotal(masterSet) {
            return masterSet.categories.reduce((sum, cat) => 
                sum + cat.sections.reduce((s, sec) => s + sec.total, 0), 0
            );
        }

        function calculateMasterSetCompleted(masterSet) {
            return masterSet.categories.reduce((sum, cat) =>
                sum + cat.sections.reduce((s, sec) => s + sec.completed, 0), 0
            );
        }

        function calculateCategoryTotal(category) {
            return category.sections.reduce((sum, sec) => sum + sec.total, 0);
        }

        function calculateCategoryCompleted(category) {
            return category.sections.reduce((sum, sec) => sum + sec.completed, 0);
        }

        function getProgressPercent(completed, total) {
            return total === 0 ? 0 : Math.round((completed / total) * 100);
        }

        // ========== SECTION MUTATIONS ==========
        function incrementSection(masterSetId, categoryId, sectionId) {
            const masterSet = state.masterSets.find(m => m.id === masterSetId);
            if (!masterSet) return;
            const category = masterSet.categories.find(c => c.id === categoryId);
            if (!category) return;
            const section = category.sections.find(s => s.id === sectionId);
            if (!section || section.completed >= section.total) return;

            section.completed++;
            section.updatedAt = new Date().toISOString();
            category.updatedAt = new Date().toISOString();
            masterSet.updatedAt = new Date().toISOString();

            // Render immediately for smooth feedback
            render();
            
            // Trigger progress bar animation
            setTimeout(() => {
                const progressBar = document.querySelector(`[data-sec-id="${sectionId}"] .progress-fill`);
                if (progressBar) {
                    progressBar.classList.add('updating');
                    setTimeout(() => progressBar.classList.remove('updating'), 600);
                }
            }, 10);

            // Immediate auto-save (no debounce for smooth UX)
            saveState();

            if (section.completed >= section.total) {
                section.completedAt = new Date().toISOString();
                awardSectionTrophy(section, masterSetId, masterSet.title, category.name);
                triggerConfetti();
            }
        }

        function decrementSection(masterSetId, categoryId, sectionId) {
            const masterSet = state.masterSets.find(m => m.id === masterSetId);
            if (!masterSet) return;
            const category = masterSet.categories.find(c => c.id === categoryId);
            if (!category) return;
            const section = category.sections.find(s => s.id === sectionId);
            if (!section || section.completed === 0 || section.completed >= section.total) return;

            section.completed--;
            section.updatedAt = new Date().toISOString();
            category.updatedAt = new Date().toISOString();
            masterSet.updatedAt = new Date().toISOString();
            
            // Render immediately
            render();
            
            // Trigger progress bar animation
            setTimeout(() => {
                const progressBar = document.querySelector(`[data-sec-id="${sectionId}"] .progress-fill`);
                if (progressBar) {
                    progressBar.classList.add('updating');
                    setTimeout(() => progressBar.classList.remove('updating'), 600);
                }
            }, 10);
            
            // Immediate auto-save
            saveState();
        }

        function addDeltaSection(masterSetId, categoryId, sectionId, delta) {
            const masterSet = state.masterSets.find(m => m.id === masterSetId);
            if (!masterSet) return;
            const category = masterSet.categories.find(c => c.id === categoryId);
            if (!category) return;
            const section = category.sections.find(s => s.id === sectionId);
            if (!section || section.completed >= section.total) return;

            section.completed = Math.min(section.total, section.completed + delta);
            section.updatedAt = new Date().toISOString();
            category.updatedAt = new Date().toISOString();
            masterSet.updatedAt = new Date().toISOString();

            // Render immediately
            render();
            
            // Trigger progress bar animation
            setTimeout(() => {
                const progressBar = document.querySelector(`[data-sec-id="${sectionId}"] .progress-fill`);
                if (progressBar) {
                    progressBar.classList.add('updating');

                }
            }, 10);

            // Immediate auto-save
            saveState();

            if (section.completed >= section.total) {
                section.completedAt = new Date().toISOString();
                awardSectionTrophy(section, masterSetId, masterSet.title, category.name);
                triggerConfetti();
            }
        }

        function editSection(masterSetId, categoryId, sectionId, updates) {
            const masterSet = state.masterSets.find(m => m.id === masterSetId);
            if (!masterSet) return;
            const category = masterSet.categories.find(c => c.id === categoryId);
            if (!category) return;
            const section = category.sections.find(s => s.id === sectionId);
            if (!section) return;

            if (updates.name !== undefined) section.name = updates.name;
            if (updates.completed !== undefined) section.completed = Math.max(0, Math.min(section.total, updates.completed));
            if (updates.total !== undefined) section.total = Math.max(1, updates.total);

            section.completedAt = section.completed >= section.total ? new Date().toISOString() : null;
            section.updatedAt = new Date().toISOString();
            category.updatedAt = new Date().toISOString();
            masterSet.updatedAt = new Date().toISOString();

            if (section.completed >= section.total && !section.trophyAwarded) {

                triggerConfetti();

            debouncedSave();
        }

        // ========== CONFETTI ANIMATION ==========
        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');
        let confettiPieces = [];
        let confettiAnimating = false;

        function resizeConfettiCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }

        function triggerConfetti() {
            const count = 50;
            const x = window.innerWidth / 2;
            const y = window.innerHeight / 2;
            const colors = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981'];
            
            for (let i = 0; i < count; i++) {
                confettiPieces.push({
                    x: x + (Math.random() - 0.5) * 100,
                    y: y + (Math.random() - 0.5) * 100,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10 - 3,
                    ax: 0,
                    ay: 0.3,
                    life: 1,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4
                });
            }
            
            if (!confettiAnimating) {
                confettiAnimating = true;
                animateConfetti();
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            
            confettiPieces = confettiPieces.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vx += p.ax;
                p.vy += p.ay;
                p.life -= 0.015;
                
                if (p.life > 0) {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    return true;
                }
                return false;
            });

            ctx.globalAlpha = 1;
            
            if (confettiPieces.length > 0) {
                requestAnimationFrame(animateConfetti);
            } else {
                confettiAnimating = false;
            }
        }

            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards';
                setTimeout(() => toast.remove(), 300);
            }, 2700);
        }

        function formatRelativeTime(isoString) {
            if (!isoString) return 'never';
            const date = new Date(isoString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            return `${days}d ago`;
        }
