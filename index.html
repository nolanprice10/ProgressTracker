    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button,input,select,textarea{color:inherit}input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;min-width:0}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}textarea{width:100%;resize:vertical}h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.04em;line-height:1.15}h2{font-size:21px;letter-spacing:-.02em}h3{font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#80aaff}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:16px}.grow{flex:1}.hidden{display:none!important}.btn{border:1px solid var(--border);border-radius:9px;background:var(--surface2);padding:8px 12px;font-weight:650;white-space:nowrap}.btn:hover{border-color:#666}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.primary:hover{background:var(--accent-hover)}.btn.ghost{background:transparent}.btn.danger{color:#fb7185}.icon-btn{width:36px;height:36px;padding:0;display:inline-grid;place-items:center}.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px}.topbar{border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}.top-inner{max-width:1320px;margin:auto;padding:14px 28px;display:flex;gap:24px;align-items:center}.brand{font-weight:800;letter-spacing:-.03em;font-size:17px;white-space:nowrap}.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:white;margin-right:8px}.nav{display:flex;gap:4px;flex:1}.nav button{background:transparent;border:0;color:var(--muted);padding:9px 12px;border-radius:8px;font-weight:650}.nav button.active{background:var(--surface2);color:var(--text)}.badge{background:var(--accent);color:#fff;border-radius:20px;padding:2px 7px;font-size:11px;margin-left:4px}.save{font-size:12px;color:var(--muted)}.save:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#34d399;margin-right:6px}.container{max-width:1320px;margin:auto;padding:40px 28px 80px}.view{animation:appear .24s ease}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.hero{margin-bottom:28px}.hero p{margin-top:8px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0}.toolbar input[type=search]{flex:1;min-width:200px}.segmented{display:flex;padding:3px;background:var(--surface);border:1px solid var(--border);border-radius:10px;gap:2px}.segmented button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:6px 10px}.segmented button.active{background:var(--surface2);color:var(--text)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.set-card,.section-card{padding:20px}.set-card{display:flex;flex-direction:column;gap:16px;transition:transform .2s,border-color .2s}.set-card:hover{transform:translateY(-3px);border-color:#555}.set-card h3{font-size:18px}.set-card .description{min-height:42px}.progress{height:8px;border-radius:20px;background:var(--track);overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}.stat-line{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px}.set-footer{margin-top:auto;border-top:1px solid var(--border);padding-top:14px}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.banner{padding:18px 20px;border-color:#315386;background:linear-gradient(110deg,rgba(59,130,246,.13),var(--surface));margin-bottom:28px}.banner p{margin-top:4px}.dashboard{padding:24px;margin:22px 0}.dashboard .big-number{font-size:36px;font-weight:800;letter-spacing:-.04em}.dashboard .progress{height:10px;margin:16px 0}.category{margin-top:28px}.category-head{margin-bottom:12px}.section-card{display:grid;gap:15px}.section-card.complete{border-color:#315e4c}.section-actions{display:flex;gap:6px;flex-wrap:wrap}.section-actions .btn{padding:6px 10px}.locked{color:#6ee7b7;font-weight:700;font-size:12px}.list .grid{grid-template-columns:1fr}.list .set-card,.list .section-card{display:flex;align-items:center;gap:20px}.list .set-card>*,.list .section-card>*{flex:1;min-width:0}.list .set-card .description{min-height:0}.list .set-footer{border:0;padding:0;margin:0}.group-title{margin:24px 0 12px}.inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inline-form input{flex:1;min-width:90px}.inline-form input[type=number]{max-width:110px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0}.metric{padding:18px}.metric strong{display:block;font-size:25px}.metric span{color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}.trophy{position:relative;overflow:hidden;aspect-ratio:2.5/3.5;border:1px solid var(--card-color);border-radius:14px;background:linear-gradient(145deg,var(--card-bg),#15151d 70%);padding:15px;display:flex;flex-direction:column;text-align:left;color:#fff;box-shadow:0 10px 24px #0004;transition:transform .25s,box-shadow .25s}.trophy:hover{transform:translateY(-7px);box-shadow:0 18px 30px #0007}.trophy:after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(115deg,transparent 25%,#ffffff22 48%,transparent 65%);transform:translateX(-120%);transition:transform .6s}.trophy:hover:after{transform:translateX(120%)}.trophy.bronze{--card-color:#bc835a;--card-bg:#5c382c}.trophy.si etti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
    @media(max-width:700px){.top-inner{padding:12px 16px;gap:8px;flex-wrap:wrap}.brand{flex:1}.nav{order:3;flex-basis:100%}.nav button{flex:1}.container{padding:28px 16px 60px}.hero.row,.banner.row{align-items:flex-start;flex-direction:column}.toolbar>*{max-width:100%}.list .set-card,.list .section-card{display:grid}.cards{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}}

<body>
  <header class="topbar"><div class="top-inner">
    <div class="brand"><span class="brand-mark">✦</span>Progress Tracker</div>
    <nav class="nav" aria-label="Main navigation"><button data-action="tab" data-value="sets" id="nav-sets">Master Sets</button><button data-action="tab" data-value="trophies" id="nav-trophies">Trophy Room <span class="badge" id="trophy-count">0</span></button></nav>
    <button class="btn ghost icon-btn" data-action="theme" id="theme-button" aria-label="Toggle theme">☼</button>
    <button class="btn ghost save" data-action="backup" id="save-status">Saved just now</button>
  </div></header>
  <main class="container" id="app"></main>
  <div id="modal-root"></div><div id="toast-root" aria-live="polite"></div><canvas class="confetti" id="confetti"></canvas>
  <script>
    'use strict';
    const STATE_KEY = 'progressTracker.state.v1', VISIT_KEY = 'progressTracker.lastVisit.v1';
    const $ = (selector, root = document) => root.querySelector(selector);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const id = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    const now = () => new Date().toISOString();
    const number = (value, fallback = 0) => Number.isFinite(Number(value)) ? Math.max(0, Math.floor(Number(value))) : fallback;
    const clamp = (value, total) => Math.min(total, number(value));
    const section = (name, total) => ({id:id(), name, completed:0, total, trophyAwarded:false, completedAt:null, updatedAt:now()});
    const category = (name, sections = []) => ({id:id(), name, completedCelebrated:false, updatedAt:now(), sections});
    const masterSet = (title, description, categories = []) => ({id:id(), title, description, completedOverride:null, targetOverride:null, completedAwarded:false, completedAt:null, updatedAt:now(), categories});
    function defaults() {
      return {activeTab:'sets', activeMasterSetId:null, lastActiveMasterSetId:null, lastSavedAt:null, lastSessionAt:null, dismissedWelcomeBanner:false, theme:'dark', searchQuery:'', sortBy:'custom', viewMode:'grid', sectionFilter:'all', sectionSort:'default', sectionViewMode:'grid', rarityFilter:'all', setFilter:'all', trophySearch:'', trophySort:'newest', trophyGroupBy:'none', trophyViewMode:'grid', trophies:[], masterSets:[
        masterSet('AP Microeconomics Units 4–6', 'Track your progress through market structures, factor markets, and market failure.', [
          category('Unit 4 · Imperfect Competition', [section('Introduction to Imperfectly Competitive Markets',4),section('Monopoly',6),section('Price Discrimination',4),section('Monopolistic Competition',5),section('Oligopoly and Game Theory',5)]),
          category('Unit 5 · Factor Markets', [section('Introduction to Factor Markets',4),section('Changes in Factor Demand and Supply',4),section('Profit-Maximizing Behavior in Factor Markets',5)]),
          category('Unit 6 · Market Failure', [section('Socially Efficient and Inefficient Market Outcomes',5),section('Externalities and Public Policy',5),section('Public and Private Goods',5)])
        ]),
        masterSet('45-Question Practice Set', 'A place to track your practice questions.', [category('Practice', [section('Practice Questions',45)])])
      ]};
    }
    function normalize(raw) {
      const base = defaults(), source = raw && typeof raw === 'object' ? raw : {};
      const state = {...base, ...source};
      state.masterSets = (Array.isArray(source.masterSets) ? source.masterSets : base.masterSets).filter(s => s && typeof s === 'object').map(s => ({
        ...s, id:String(s.id || id()), title:String(s.title || 'Untitled set'), description:String(s.description || ''),
        completedOverride:s.completedOverride == null ? null : number(s.completedOverride), targetOverride:s.targetOverride == null ? null : Math.max(1, number(s.targetOverride, 1)),
        completedAwarded:!!s.completedAwarded, completedAt:s.completedAt || null, updatedAt:s.updatedAt || now(),
        categories:(Array.isArray(s.categories) ? s.categories : []).filter(c => c && typeof c === 'object').map(c => ({
          ...c, id:String(c.id || id()), name:String(c.name || 'Untitled category'), completedCelebrated:!!c.completedCelebrated, updatedAt:c.updatedAt || now(),
          sections:(Array.isArray(c.sections) ? c.sections : []).filter(x => x && typeof x === 'object').map(x => {
            const total = Math.max(1, number(x.total, 1));
            return {...x, id:String(x.id || id()), name:String(x.name || 'Untitled section'), total, completed:clamp(x.completed, total), trophyAwarded:!!x.trophyAwarded, completedAt:x.completedAt || null, updatedAt:x.updatedAt || now()};
          })
        }))
      }));
      state.trophies = (Array.isArray(source.trophies) ? source.trophies : []).filter(t => t && typeof t === 'object').map(t => ({...t, id:String(t.id || id()), points:number(t.points), rarity:['bronze','silver','gold','mythic'].includes(t.rarity) ? t.rarity : 'bronze'}));
      if (!['sets','trophies'].includes(state.activeTab)) state.activeTab = 'sets';
      if (!['dark','light'].includes(state.theme)) state.theme = 'dark';
      if (!state.masterSets.some(s => s.id === state.activeMasterSetId)) state.activeMasterSetId = null;
      return state;
    }
    let stored = null, previousVisit = null;
    try { stored = JSON.parse(localStorage.getItem(STATE_KEY)); previousVisit = localStorage.getItem(VISIT_KEY); } catch (e) { console.warn('Unable to read saved progress', e); }
    let state = normalize(stored), saving = false, savingTimer, toastTimer;
    state.lastSessionAt = stored ? (previousVisit || state.lastSavedAt || null) : null;
    try { localStorage.setItem(VISIT_KEY, now()); } catch (e) { console.warn('Unable to save visit', e); }
    function save() {
      state.lastSavedAt = now(); saving = true;
      try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) { console.warn('Unable to save progress', e); toast('Unable to save locally. Export a backup if possible.'); }
      updateSave(); clearTimeout(savingTimer); savingTimer = setTimeout(() => { saving = false; updateSave(); }, 500);
    }
    function relative(date) {
      const ms = Date.now() - new Date(date).getTime();
      if (!date || !Number.isFinite(ms) || ms < 60000) return 'just now';
      const minutes = Math.floor(ms / 60000);
      if (minutes < 60) return minutes + 'm ago';
      if (minutes < 1440) return Math.floor(minutes / 60) + 'h ago';
      return Math.floor(minutes / 1440) + 'd ago';
    }
    function updateSave() {
      const el = $('#save-status'); if (!el) return;
      el.textContent = saving ? 'Saving…' : 'Saved ' + relative(state.lastSavedAt);
      el.title = 'Storage key: ' + STATE_KEY + '\nLast saved: ' + (state.lastSavedAt ? new Date(state.lastSavedAt).toLocaleString() : 'Not yet saved');
    }
    function persist() { try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); localStorage.setItem(VISIT_KEY, now()); } catch (e) { console.warn('Unable to save progress', e); } }
    window.addEventListener('beforeunload', persist); window.addEventListener('pagehide', persist);
    document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
    window.addEventListener('storage', event => { if (event.key === STATE_KEY && event.newValue) { try { state = normalize(JSON.parse(event.newValue)); render(); } catch (e) { console.warn('Unable to load updated progress', e); } } });
    setInterval(updateSave, 30000);
    function sums(set) { return set.categories.flatMap(c => c.sections).reduce((a,s) => ({completed:a.completed+s.completed,total:a.total+s.total}), {completed:0,total:0}); }
    function totals(set) { const auto = sums(set); return {completed:set.completedOverride ?? auto.completed,total:set.targetOverride ?? auto.total}; }
    function percent(completed, total) { return total > 0 ? Math.min(100, Math.round(completed / total * 100)) : 0; }
    function isDone(completed, total) { return total > 0 && completed >= total; }
    function points() { return state.trophies.reduce((sum,t) => sum + number(t.points), 0); }
    function findSet(setId) { return state.masterSets.find(s => s.id === setId); }
    function findCategory(set, categoryId) { return set && set.categories.find(c => c.id === categoryId); }
    function findSection(cat, sectionId) { return cat && cat.sections.find(s => s.id === sectionId); }
    function toast(message) { const root = $('#toast-root'); root.innerHTML = '<div class="toast">'+esc(message)+'</div>'; clearTimeout(toastTimer); toastTimer = setTimeout(() => root.innerHTML = '', 3500); }
    function celebrate() {
      const canvas = $('#confetti'), ctx = canvas.getContext('2d'); if (!ctx) return;
      canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
      const bits = Array.from({length:75}, () => ({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:-Math.random()*12-3,color:['#60a5fa','#fbbf24','#f472b6','#34d399'][Math.floor(Math.random()*4)],life:70+Math.random()*30}));
      function frame() { ctx.clearRect(0,0,innerWidth,innerHeight); bits.forEach(b => { b.x+=b.vx; b.y+=b.vy; b.vy+=.25; b.life--; ctx.fillStyle=b.color; ctx.fillRect(b.x,b.y,6,6); }); if(bits.some(b=>b.life>0)) requestAnimationFrame(frame); else ctx.clearRect(0,0,innerWidth,innerHeight); } frame();
    }
    function achievements(set, cat, sec) {
      if (sec && isDone(sec.completed,sec.total) && !sec.trophyAwarded) {
        const rarity = sec.total <= 3 ? 'bronze' : sec.total <= 6 ? 'silver' : 'gold';
        state.trophies.push({id:id(), title:sec.name, masterSetId:set.id, masterSetTitle:set.title, categoryId:cat.id, sectionId:sec.id, rarity, rank:rarity === 'bronze' ? ['I','II','III'][sec.total-1] : rarity === 'silver' ? 'Q' : 'K', suit:rarity === 'bronze' ? 'club' : rarity === 'silver' ? 'diamond' : 'spade', points:sec.total, unlockedAt:now()});
        sec.trophyAwarded = true; sec.completedAt = now(); celebrate(); toast('Section complete! Trophy card unlocked.');
      }
      if (cat && cat.sections.length && cat.sections.every(s => isDone(s.completed,s.total)) && !cat.completedCelebrated) { cat.completedCelebrated = true; celebrate(); toast('Category complete: ' + cat.name); }
      const t = totals(set);
      if (isDone(t.completed,t.total) && !set.completedAwarded) {
        state.trophies.push({id:id(), title:'Master Sovereign', masterSetId:set.id, masterSetTitle:set.title, rarity:'mythic', rank:'crown', suit:'crown', points:25, unlockedAt:now()});
        set.completedAwarded = true; set.completedAt = now(); celebrate(); toast('Master set complete! Mythic card unlocked.');
      }
    }
    function touch(set, cat, sec) { const date = now(); if (set) set.updatedAt=date; if (cat) cat.updatedAt=date; if (sec) sec.updatedAt=date; }
    function changeSection(set, cat, sec, amount) {
      if (!sec || isDone(sec.completed,sec.total)) return;
      sec.completed = Math.min(sec.total, Math.max(0, sec.completed + amount)); touch(set,cat,sec); achievements(set,cat,sec); save(); render();
    }
    function bar(completed,total) { return '<div class="stat-line"><span>'+esc(completed)+' / '+esc(total)+' questions</span><strong>'+percent(completed,total)+'%</strong></div><div class="progress"><span style="width:'+percent(completed,total)+'%"></span></div>'; }
    function options(values, selected) { return values.map(([value,label]) => '<option value="'+esc(value)+'"'+(selected===value?' selected':'')+'>'+esc(label)+'</option>').join(''); }
    function select(name, values, selected, label) { return '<select data-control="'+name+'" aria-label="'+esc(label)+'">'+options(values,selected)+'</select>'; }
    function segment(name, selected, values) { return '<div class="segmented">'+values.map(([value,label])=>'<button data-action="control" data-control="'+name+'" data-value="'+value+'" class="'+(selected===value?'active':'')+'" aria-pressed="'+(selected===value)+'">'+label+'</button>').join('')+'</div>'; }
    function setCard(set) {
      const t=totals(set), count=set.categories.reduce((n,c)=>n+c.sections.length,0);
      return '<article class="panel set-card"><div><div class="eyebrow">Master set</div><h3>'+esc(set.title)+'</h3></div><p class="muted description">'+esc(set.description || 'Your learning journey starts here.')+'</p><div>'+bar(t.completed,t.total)+'</div><div class="row between set-footer"><span class="muted small">'+count+' sections</span><div class="row"><button class="btn ghost" data-action="inline-set" data-set="'+esc(set.id)+'">Edit</button><button class="btn primary" data-action="open-set" data-set="'+esc(set.id)+'">Open →</button></div></div></article>';
    }
    function homepage() {
      const query=String(state.searchQuery).toLowerCase().trim();
      let sets=state.masterSets.filter(s=>[s.title,s.description,...s.categories.flatMap(c=>[c.name,...c.sections.map(x=>x.name)])].some(v=>String(v).toLowerCase().includes(query)));
      const progress=s=>{const t=totals(s);return t.total ? t.completed/t.total : 0;};
      const sorts={progressDesc:(a,b)=>progress(b)-progress(a),progressAsc:(a,b)=>progress(a)-progress(b),questions:(a,b)=>totals(b).total-totals(a).total,alpha:(a,b)=>a.title.localeCompare(b.title),inProgress:(a,b)=>(progress(b)>0&&progress(b)<1)-(progress(a)>0&&progress(a)<1),completed:(a,b)=>(progress(b)>=1)-(progress(a)>=1)};
      if(sorts[state.sortBy]) sets.sort(sorts[state.sortBy]);

    function parseRows(text) {

        if(cols.length>=3 && /^\d+$/.test(cols[2])) { group(cols[0]||'General'); if(cols[1]) add(cols[1],cols[2]); continue; }
        if(cols.length===2 && /^\d+$/.test(cols[1])) { if(cols[0]) add(cols[0],cols[1]); continue; }

      }
      else if(action==='download'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');a.href=url;a.download='progress-tracker-'+now().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
      else if(action==='copy'){try{await navigator.clipboard.writeText(JSON.stringify(state,null,2));toast('Backup copied to clipboard.');}catch(e){toast('Clipboard unavailable. Download your backup instead.');}}
      else if(action==='restore'){try{const data=JSON.parse($('#backup-text').value);if(!data||!Array.isArray(data.masterSets))throw new Error('Backup must contain a masterSets array.');state=normalize(data);closeModal();save();render();toast('Backup restored.');}catch(e){toast('Invalid backup: '+e.message);}}
    });
    document.addEventListener('submit', event=>{
      const form=event.target; if(!form.dataset.form) return; event.preventDefault();
      const values=new FormData(form), kind=form.dataset.form, set=findSet(form.dataset.set), cat=findCategory(set,form.dataset.category), sec=findSection(cat,form.dataset.section);
      if(kind==='set') {
        const title=String(values.get('title')).trim(); if(!title) return;
        if(set){set.title=title;set.description=String(values.get('description')).trim();set.completedOverride=values.get('completed')===''?null:number(values.get('completed'));set.targetOverride=values.get('target')===''?null:Math.max(1,number(values.get('target'),1));touch(set);achievements(set);}
        else state.masterSets.push(masterSet(title,String(values.get('description')).trim()));
      } else if(kind==='category' && set) {
        const name=String(values.get('name')).trim(); if(!name)return;
        if(cat){cat.name=name;touch(set,cat);} else {set.categories.push(category(name));touch(set);}
      } else if(kind==='section' && set && cat) {
        const name=String(values.get('name')).trim();if(!name)return; const total=Math.max(1,number(values.get('total'),1)), completed=clamp(values.get('completed'),total);
        const target=sec||section(name,total);target.name=name;target.total=total;target.completed=completed;if(!sec)cat.sections.push(target);touch(set,cat,target);achievements(set,cat,target);
      } else if(kind==='import') {
        const groups=parseRows($('#import-text').value), title=String(values.get('title')).trim(); if(!title||!groups.length){toast('Add at least one section with a question count.');return;}
        state.masterSets.push(masterSet(title,'Imported master set',groups.map(g=>category(g.name,g.sections.map(s=>section(s.name,s.total))))));
      } else return;
      closeModal();save();render();
    });
    document.addEventListener('focusout', event=>{
      const form=event.target.closest('form[data-inline]');
      if(form) setTimeout(()=>{if(form.isConnected && !form.contains(document.activeElement) && !document.querySelector('.modal') && form.checkValidity()) form.requestSubmit();},0);
    });
    document.addEventListener('keydown', event=>{if(event.key==='Escape'){if($('#modal-root').innerHTML) closeModal(); else if(event.target.closest('form[data-inline]')) render();}});
    render();
  </script>
</body>
</html>
