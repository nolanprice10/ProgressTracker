                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm">${percent}%</span>
                            <span class="text-xs text-gray-400">${completed} / ${total}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percent}%"></div>
                        </div>
                    </div>

                    <div class="text-xs text-gray-500">
                        Saved ${formatRelativeTime(masterSet.updatedAt)}
                    </div>
                </div>
            `;
        }

        function renderDetailView() {
            const masterSet = state.masterSets.find(m => m.id === state.activeMasterSetId);
            if (!masterSet) return '';

            const completed = masterSet.completedOverride ?? calculateMasterSetCompleted(masterSet);
            const total = masterSet.targetOverride ?? calculateMasterSetTotal(masterSet);
            const percent = getProgressPercent(completed, total);

            return `
                <div class="max-w-7xl mx-auto px-4 py-8">
                    <button class="back-btn mb-6 px-4 py-2 rounded-lg hover:bg-opacity-50">← Back to Master Sets</button>

                    <div class="card-bg rounded-lg p-6 mb-8 border sticky top-20 z-20">
                        <div class="flex justify-between items-center mb-4">
                            <h1 class="edit-master-title text-2xl font-bold cursor-pointer hover:opacity-70" data-id="${masterSet.id}">
                                ${masterSet.title}
                            </h1>
                            <button class="delete-set-btn text-red-400 hover:text-red-300">🗑️</button>
                        </div>

                        <div class="mb-4">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-lg font-semibold">${percent}%</span>
                                <span class="text-sm text-gray-400">${completed} / ${total}</span>
                            </div>
                            <div class="progress-bar h-3">
                                <div class="progress-fill" style="width: ${percent}%"></div>
                            </div>
                        </div>

                        ${masterSet.completedOverride !== null || masterSet.targetOverride !== null ? `
                            <button class="sync-btn text-sm text-blue-400 hover:text-blue-300">🔄 Sync to Auto-Sum</button>
                        ` : ''}

                        <button class="add-category-btn text-sm text-blue-400 hover:text-blue-300 mt-2">+ Add Category</button>
                    </div>

                    <div class="flex gap-4 mb-6">
                        <select class="section-filter-select inline-edit px-3 py-2 rounded-lg">
                            <option value="all">All Sections</option>
                            <option value="incomplete">Incomplete Only</option>
                            <option value="completed">Completed Only</option>
                        </select>

                        <select class="section-sort-select inline-edit px-3 py-2 rounded-lg">
                            <option value="default">Default Order</option>
                            <option value="incomplete_first">Incomplete First</option>
                            <option value="progress_asc">Progress (Low → High)</option>
                            <option value="progress_desc">Progress (High → Low)</option>
                            <option value="questions_desc">Most Questions</option>
                            <option value="alpha_asc">Alphabetical</option>
                        </select>

                        <div class="flex gap-2 ml-auto">
                            <button class="section-view-toggle-btn px-3 py-2 rounded-lg inline-edit" data-view="grid">🔲</button>
                            <button class="section-view-toggle-btn px-3 py-2 rounded-lg inline-edit" data-view="checklist">☑️</button>
                        </div>
                    </div>

                    <div class="space-y-8">
                        ${masterSet.categories.map(cat => renderCategory(masterSet, cat)).join('')}
                    </div>
                </div>
            `;
        }

        function renderCategory(masterSet, category) {
            const completed = calculateCategoryCompleted(category);
            const total = calculateCategoryTotal(category);
            const percent = getProgressPercent(completed, total);

            let sections = category.sections;
            if (state.sectionFilter === 'incomplete') {
                sections = sections.filter(s => s.completed < s.total);
            } else if (state.sectionFilter === 'completed') {
                sections = sections.filter(s => s.completed >= s.total);
            }

            if (state.sectionSort === 'incomplete_first') {
                sections = sections.sort((a, b) => (a.completed >= a.total) - (b.completed >= b.total));
            } else if (state.sectionSort === 'progress_asc') {
                sections = sections.sort((a, b) => getProgressPercent(a.completed, a.total) - getProgressPercent(b.completed, b.total));
            } else if (state.sectionSort === 'progress_desc') {
                sections = sections.sort((a, b) => getProgressPercent(b.completed, b.total) - getProgressPercent(a.completed, a.total));
            } else if (state.sectionSort === 'questions_desc') {
                sections = sections.sort((a, b) => b.total - a.total);
            } else if (state.sectionSort === 'alpha_asc') {
                sections = sections.sort((a, b) => a.name.localeCompare(b.name));
            }

            return `
                <div class="card-bg rounded-lg p-6 border">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="edit-category-name text-xl font-semibold cursor-pointer hover:opacity-70" data-master-id="${masterSet.id}" data-cat-id="${category.id}">
                            ${category.name}
                        </h2>
                        <button class="delete-category-btn text-red-400 hover:text-red-300" data-master-id="${masterSet.id}" data-cat-id="${category.id}">🗑️</button>
                    </div>

                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm">${percent}%</span>
                        <span class="text-xs text-gray-400">${completed} / ${total}</span>
                    </div>

                    <div class="progress-bar mb-4">
                        <div class="progress-fill" style="width: ${percent}%"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        ${sections.map(sec => renderSection(masterSet, category, sec)).join('')}
                    </div>

                    <button class="add-section-btn text-sm text-blue-400 hover:text-blue-300" data-master-id="${masterSet.id}" data-cat-id="${category.id}">
                        + Add Section
                    </button>
                </div>
            `;
        }

        function renderSection(masterSet, category, section) {
            const isLocked = section.completed >= section.total && section.total > 0;
            const percent = getProgressPercent(section.completed, section.total);

            if (isLocked) {
                return `
                    <div class="card-bg rounded-lg p-4 border opacity-60">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="font-medium">${section.name}</h3>
                                <div class="text-xs text-gray-400 mt-1">✓ 100% Completed · Trophy Earned</div>
                            </div>
                            <span class="text-2xl">🏆</span>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="card-bg rounded-lg p-4 border">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-medium flex-1 edit-section-name cursor-pointer hover:opacity-70" 
                            data-master-id="${masterSet.id}" data-cat-id="${category.id}" data-sec-id="${section.id}">
                            ${section.name}
                        </h3>
                        <button class="delete-section-btn text-red-400 hover:text-red-300 text-sm" 
                            data-master-id="${masterSet.id}" data-cat-id="${category.id}" data-sec-id="${section.id}">🗑️</button>
                    </div>

                    <div class="mb-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm font-medium edit-section-completed cursor-pointer hover:opacity-70" 
                                data-master-id="${masterSet.id}" data-cat-id="${category.id}" data-sec-id="${section.id}">
                                ${section.completed}
                            </span>
                            <span class="text-xs text-gray-400 edit-section-total cursor-pointer hover:opacity-70"
                                data-master-id="${masterSet.id}" data-cat-id="${category.id}" data-sec-id="${section.id}">
                                / ${section.total}
                            </span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percent}%"></div>
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <button class="decrement-btn px-2 py-1 rounded text-sm" data-master-id="${masterSet.id}" data-cat-id="${category.id}" data-sec-id="${section.id}">-1</button>
                        <button class="increment-btn px-2 py-1 rounded text-sm" data-master-id="${masterSet.id}" data-cat-id="${category.id}" data-sec-id="${section.id}">+1</button>
                        <button class="plus-five-btn px-2 py-1 rounded text-sm" data-master-id="${masterSet.id}" data-cat-id="${category.id}" data-sec-id="${section.id}">+5</button>
                        <button class="complete-btn px-2 py-1 rounded text-sm ml-auto" data-master-id="${masterSet.id}" data-cat-id="${category.id}" data-sec-id="${section.id}">✓</button>
                    </div>
                </div>
            `;
        }

        function renderTrophiesTab() {
            const trophies = filterAndSortTrophies();
            const totalPoints = calculateTotalPoints();
            const rarityStats = { mythic: 0, gold: 0, silver: 0, bronze: 0 };
            state.unlockedTrophies.forEach(t => rarityStats[t.rarity]++);
            
            return `
                <div class="max-w-7xl mx-auto px-4 py-8">
                    <div class="mb-10">
                        <h1 class="text-4xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-blue-600 bg-clip-text text-transparent">Your Collection</h1>
                        <p class="text-gray-400 mb-6">Track your trophies and celebrate your achievements</p>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="stat-card border-2 border-blue-500/30 hover:border-blue-500/60">
                                <div class="text-xs text-gray-400 font-semibold uppercase tracking-wide mb-2">Total Points</div>
                                <div class="text-3xl font-black text-transparent bg-gradient-to-r from-blue-400 to-blue-600 bg-clip-text">${totalPoints}</div>
                            </div>
                            <div class="stat-card border-2 border-blue-500/30 hover:border-blue-500/60">
                                <div class="text-xs text-gray-400 font-semibold uppercase tracking-wide mb-2">Total Cards</div>
                                <div class="text-3xl font-black text-blue-400">${state.unlockedTrophies.length}</div>
                            </div>
                            ${[
                                { rarity: 'gold', emoji: '👑', color: 'from-yellow-400 to-orange-500' },
                                { rarity: 'silver', emoji: '◆', color: 'from-gray-300 to-gray-400' },
                                { rarity: 'bronze', emoji: '⚔️', color: 'from-orange-600 to-orange-700' },
                                { rarity: 'mythic', emoji: '✨', color: 'from-purple-500 to-pink-500' }
                            ].map(({ rarity, emoji, color }) => {
                                const count = rarityStats[rarity];
                                return `
                                    <div class="stat-card border-2 border-${rarity === 'gold' ? 'yellow-500/30' : rarity === 'silver' ? 'gray-500/30' : rarity === 'bronze' ? 'orange-500/30' : 'purple-500/30'} hover:border-${rarity === 'gold' ? 'yellow-500/60' : rarity === 'silver' ? 'gray-500/60' : rarity === 'bronze' ? 'orange-500/60' : 'purple-500/60'}">
                                        <div class="flex items-center justify-between mb-2">
                                            <span class="text-xs text-gray-400 font-semibold uppercase tracking-wide">${rarity}</span>
                                            <span class="text-lg">${emoji}</span>
                                        </div>
                                        <div class="text-3xl font-black">${count}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="bg-gradient-to-r from-blue-500/10 to-purple-500/10 border border-blue-500/30 rounded-lg p-6 mb-8">
                        <h3 class="font-semibold mb-3 text-lg">🎯 Collection Filters</h3>
                        <div class="flex flex-col md:flex-row gap-3 flex-wrap">
                            <input type="text" class="trophy-search flex-1 inline-edit px-4 py-2 rounded-lg min-w-200" placeholder="🔍 Search trophies..." style="min-width: 200px;">
                            
                            <select class="rarity-filter-select inline-edit px-3 py-2 rounded-lg">
                                <option value="all">All Rarities</option>
                                <option value="mythic">✨ Mythic</option>
                                <option value="gold">👑 Gold</option>
                                <option value="silver">◆ Silver</option>
                                <option value="bronze">⚔️ Bronze</option>
                            </select>

                            <select class="set-filter-select inline-edit px-3 py-2 rounded-lg">
                                <option value="all">All Sets</option>
                                ${state.masterSets.map(m => `<option value="${m.id}">${m.title}</option>`).join('')}
                            </select>

                            <select class="trophy-sort-select inline-edit px-3 py-2 rounded-lg">
                                <option value="newest">Newest Unlocked</option>
                                <option value="rarity_desc">Highest Rarity</option>
                                <option value="points_desc">Most Points</option>
                                <option value="name_asc">Name (A–Z)</option>
                                <option value="set_asc">Master Set</option>
                            </select>

                            <select class="trophy-group-select inline-edit px-3 py-2 rounded-lg">
                                <option value="none">No Grouping</option>
                                <option value="rarity">Group by Rarity</option>
                                <option value="master_set">Group by Master Set</option>
                            </select>

                            <div class="flex gap-2 ml-auto">
                                <button class="trophy-view-toggle-btn px-4 py-2 rounded-lg inline-edit font-semibold" data-view="grid">🔲 Grid</button>
                                <button class="trophy-view-toggle-btn px-4 py-2 rounded-lg inline-edit font-semibold" data-view="spread">🎴 Spread</button>
                                <button class="trophy-view-toggle-btn px-4 py-2 rounded-lg inline-edit font-semibold" data-view="binder">📋 Binder</button>
                            </div>
                        </div>
                    </div>

                    <div class="mb-8">
                        ${trophies.length === 0 ? `
                            <div class="text-center py-16">
                                <div class="text-5xl mb-4">🏆</div>
                                <div class="text-xl font-semibold text-gray-300 mb-2">No trophies yet</div>
                                <div class="text-gray-500">Complete master sets to start building your collection!</div>
                            </div>
                        ` : renderTrophyView(trophies)}
                    </div>
                </div>
            `;
        }

        function filterAndSortTrophies() {
            let trophies = [...state.unlockedTrophies];

            if (state.rarityFilter !== 'all') {
                trophies = trophies.filter(t => t.rarity === state.rarityFilter);
            }

            if (state.setFilter !== 'all') {
                trophies = trophies.filter(t => t.masterSetId === state.setFilter);
            }

            if (state.trophySearch) {
                const search = state.trophySearch.toLowerCase();
                trophies = trophies.filter(t => 
                    t.title.toLowerCase().includes(search) ||
                    t.masterSetTitle.toLowerCase().includes(search)
                );
            }

            if (state.trophySort === 'newest') {
                trophies.sort((a, b) => new Date(b.earnedAt) - new Date(a.earnedAt));
            } else if (state.trophySort === 'rarity_desc') {
                const rarityOrder = { mythic: 4, gold: 3, silver: 2, bronze: 1 };
                trophies.sort((a, b) => (rarityOrder[b.rarity] || 0) - (rarityOrder[a.rarity] || 0));
            } else if (state.trophySort === 'points_desc') {
                trophies.sort((a, b) => b.points - a.points);
            } else if (state.trophySort === 'name_asc') {
                trophies.sort((a, b) => a.title.localeCompare(b.title));
            } else if (state.trophySort === 'set_asc') {
                trophies.sort((a, b) => a.masterSetTitle.localeCompare(b.masterSetTitle));
            }

            return trophies;
        }

        function renderTrophyView(trophies) {
            if (state.trophyViewMode === 'spread') {
                return renderDeckSpread(trophies);
            } else if (state.trophyViewMode === 'binder') {
                return renderBinderView(trophies);
            } else {
                return renderTrophyGrid(trophies);
            }
        }

        function renderTrophyGrid(trophies) {
            if (state.trophyGroupBy === 'none') {
                return `
                    <div class="trophy-grid">
                        ${trophies.map((t, i) => `<div class="trophy-item" style="animation-delay: ${i * 30}ms;">${renderPlayingCard(t)}</div>`).join('')}
                    </div>
                `;
            } else if (state.trophyGroupBy === 'rarity') {
                const groups = { mythic: [], gold: [], silver: [], bronze: [] };
                trophies.forEach(t => groups[t.rarity]?.push(t));
                const rarityEmojis = { mythic: '✨', gold: '👑', silver: '◆', bronze: '⚔️' };
                return Object.entries(groups).map(([rarity, group]) => {
                    if (group.length === 0) return '';
                    return `
                    <div class="mb-10">
                        <div class="flex items-center gap-3 mb-6">
                            <span class="text-2xl">${rarityEmojis[rarity]}</span>
                            <h3 class="text-2xl font-bold uppercase tracking-wider">${rarity} Cards</h3>
                            <span class="ml-auto rarity-badge ${rarity}">${group.length}</span>
                        </div>
                        <div class="trophy-grid">
                            ${group.map((t, i) => `<div class="trophy-item" style="animation-delay: ${i * 30}ms;">${renderPlayingCard(t)}</div>`).join('')}
                        </div>
                    </div>
                `;
                }).join('');
            } else if (state.trophyGroupBy === 'master_set') {
                const groups = {};
                trophies.forEach(t => {
                    if (!groups[t.masterSetId]) groups[t.masterSetId] = { title: t.masterSetTitle, cards: [] };
                    groups[t.masterSetId].cards.push(t);
                });
                return Object.values(groups).map(g => `
                    <div class="mb-10">
                        <h3 class="text-2xl font-bold mb-6">${g.title}</h3>
                        <div class="trophy-grid">
                            ${g.cards.map((t, i) => `<div class="trophy-item" style="animation-delay: ${i * 30}ms;">${renderPlayingCard(t)}</div>`).join('')}
                        </div>
                    </div>
                `).join('');
            }
        }

        function renderPlayingCard(trophy) {
            return `
                <div class="playing-card ${trophy.rarity} cursor-pointer open-trophy-btn transition-all hover:shadow-2xl" data-id="${trophy.id}">
                    <div class="card-corner top-left">
                        <div style="letter-spacing: 1px;">${trophy.rank}</div>
                        <div class="card-suit">${trophy.suit}</div>
                    </div>
                    <div class="card-corner bottom-right">
                        <div style="letter-spacing: 1px;">${trophy.rank}</div>
                        <div class="card-suit">${trophy.suit}</div>
                    </div>
                    <div class="flex flex-col items-center justify-center h-full px-3 py-4 text-center relative z-10">
                        <div class="text-3xl mb-2 opacity-80">🏆</div>
                        <div class="text-xs opacity-70 font-semibold mb-1 leading-tight" style="font-size: 10px; max-width: 90%; line-height: 1.2;">${trophy.masterSetTitle}</div>
                        <div class="text-xs font-bold my-2 leading-tight" style="font-size: 11px; max-width: 95%;">${trophy.title}</div>
                        <div class="text-sm font-black mt-auto" style="font-size: 13px; letter-spacing: 1px;">${trophy.points}</div>
                        <div class="text-xs opacity-60 font-semibold">POINTS</div>
                    </div>
                </div>
            `;
        }

        function renderDeckSpread(trophies) {
            return `
                <div class="deck-spread">
                    ${trophies.map((t, i) => {
                        const angle = (i - Math.floor(trophies.length / 2)) * 5;
                        const offset = Math.abs(i - Math.floor(trophies.length / 2)) * 10;
                        return `
                            <div class="deck-card w-20 h-28" style="transform: rotateZ(${angle}deg) translateY(${offset}px);">
                                ${renderPlayingCard(t)}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderBinderView(trophies) {
            return `
                <div class="card-bg rounded-lg border overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="border-b">
                            <tr>
                                <th class="text-left p-3">Card</th>
                                <th class="text-left p-3">Rarity</th>
                                <th class="text-left p-3">Master Set</th>
                                <th class="text-right p-3">Points</th>
                                <th class="text-left p-3">Earned</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${trophies.map(t => `
                                <tr class="border-b hover:bg-opacity-50 cursor-pointer open-trophy-btn" data-id="${t.id}">
                                    <td class="p-3">${t.rank} ${t.suit} ${t.title}</td>
                                    <td class="p-3"><span class="capitalize px-2 py-1 rounded bg-opacity-20" style="background-color: var(--accent);">${t.rarity}</span></td>
                                    <td class="p-3 text-gray-400">${t.masterSetTitle}</td>
                                    <td class="p-3 text-right font-semibold">${t.points}</td>
                                    <td class="p-3 text-gray-400">${formatRelativeTime(t.earnedAt)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderModals() {
            return `
                ${state.showNewSetModal ? renderNewSetModal() : ''}
                ${state.showImportModal ? renderImportModal() : ''}
                ${state.showTrophyModal ? renderTrophyModal() : ''}
                ${state.showBackupModal ? renderBackupModal() : ''}
            `;
        }

        function renderNewSetModal() {
            return `
                <div class="modal-overlay" id="new-set-modal">
                    <div class="modal-content">
                        <h2 class="text-xl font-bold mb-4">Create New Master Set</h2>
                        <input type="text" class="new-set-title inline-edit w-full px-4 py-2 rounded-lg mb-3" placeholder="Master Set Title">
                        <input type="text" class="new-set-desc inline-edit w-full px-4 py-2 rounded-lg mb-3" placeholder="Description (optional)">
                        <input type="number" class="new-set-goal inline-edit w-full px-4 py-2 rounded-lg mb-4" placeholder="Target goal (optional)" min="1">
                        <div class="flex gap-2">
                            <button class="confirm-new-set accent-btn text-white px-4 py-2 rounded-lg font-medium flex-1">Create</button>
                            <button class="cancel-modal px-4 py-2 rounded-lg flex-1">Cancel</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderImportModal() {
            return `
                <div class="modal-overlay" id="import-modal">
                    <div class="modal-content max-w-2xl">
                        <h2 class="text-xl font-bold mb-4">Import Master Set</h2>
                        <textarea class="import-text inline-edit w-full px-4 py-2 rounded-lg mb-3 h-40" placeholder="Paste CSV, TSV, or structured text here..."></textarea>
                        <input type="file" class="import-file inline-edit w-full px-4 py-2 rounded-lg mb-4" accept=".csv,.txt,.tsv,.md">
                        <div id="import-preview" class="mb-4 p-4 card-bg rounded-lg border">
                            <div class="text-sm text-gray-400">Preview will appear here...</div>
                        </div>
                        <div class="flex gap-2">
                            <button class="confirm-import accent-btn text-white px-4 py-2 rounded-lg font-medium flex-1">Import</button>
                            <button class="cancel-modal px-4 py-2 rounded-lg flex-1">Cancel</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTrophyModal() {
            const trophy = state.unlockedTrophies.find(t => t.id === state.selectedTrophyId);
            if (!trophy) return '';

            return `
                <div class="modal-overlay" id="trophy-modal">
                    <div class="modal-content max-w-md">
                        <div class="flex justify-center mb-8">
                            <div class="w-40 h-56 trophy-item">
                                ${renderPlayingCard(trophy)}
                            </div>
                        </div>
                        <h2 class="text-2xl font-bold mb-4 text-center">${trophy.title}</h2>
                        <div class="space-y-3 mb-6">
                            <div class="flex items-center justify-between p-3 stat-card">
                                <span class="text-gray-400">Rarity</span>
                                <span class="rarity-badge ${trophy.rarity}">${trophy.rarity.toUpperCase()}</span>
                            </div>
                            <div class="flex items-center justify-between p-3 stat-card">
                                <span class="text-gray-400">Points Earned</span>
                                <span class="text-lg font-bold text-blue-400">${trophy.points}</span>
                            </div>
                            <div class="flex items-center justify-between p-3 stat-card">
                                <span class="text-gray-400">Master Set</span>
                                <span class="text-sm font-semibold">${trophy.masterSetTitle}</span>
                            </div>
                            <div class="flex items-center justify-between p-3 stat-card">
                                <span class="text-gray-400">Earned</span>
                                <span class="text-sm">${formatRelativeTime(trophy.earnedAt)}</span>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <button class="goto-set-btn accent-btn text-white px-4 py-3 rounded-lg font-semibold flex-1">Go to Set</button>
                            <button class="cancel-modal bg-gray-700 hover:bg-gray-600 text-white px-4 py-3 rounded-lg font-semibold flex-1 transition-all">Close</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBackupModal() {
            return `
                <div class="modal-overlay" id="backup-modal">
                    <div class="modal-content max-w-2xl">
                        <h2 class="text-2xl font-bold mb-6">📦 Backup & Restore</h2>
                        <div class="mb-8">
                            <h3 class="font-semibold mb-4 text-lg">📥 Export Backup</h3>
                            <div class="flex gap-3">
                                <button class="export-json accent-btn text-white px-4 py-3 rounded-lg font-semibold flex-1 transition-all">Download JSON</button>
                                <button class="copy-json bg-gray-700 hover:bg-gray-600 text-white px-4 py-3 rounded-lg font-semibold flex-1 transition-all">Copy to Clipboard</button>
                            </div>
                        </div>
                        <div class="mb-8">
                            <h3 class="font-semibold mb-4 text-lg">🔄 Restore from Backup</h3>
                            <input type="file" class="restore-file inline-edit w-full px-4 py-2 rounded-lg mb-3" accept=".json">
                            <textarea class="restore-json inline-edit w-full px-4 py-2 rounded-lg h-32" placeholder="Or paste JSON here..."></textarea>
                            <button class="restore-backup accent-btn text-white px-4 py-3 rounded-lg font-semibold mt-3 w-full transition-all">Restore</button>
                        </div>
                        <button class="cancel-modal bg-gray-700 hover:bg-gray-600 text-white px-4 py-3 rounded-lg font-semibold w-full transition-all">Close</button>
                    </div>
                </div>
            `;
        }

        function attachEventListeners() {
            // Tab switching
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.activeTab = e.target.closest('.tab-btn').dataset.tab;
                    if (state.activeTab === 'sets') {
                        state.activeMasterSetId = null;
                    }
                    render();
                });
            });

            // Theme toggle
            document.querySelector('.theme-toggle')?.addEventListener('click', () => {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.classList.toggle('dark', state.theme === 'dark');
                debouncedSave();
            });

            // Backup button
            document.querySelector('.backup-btn')?.addEventListener('click', () => {
                state.showBackupModal = !state.showBackupModal;
                render();
            });

            // Welcome banner
            document.querySelector('.dismiss-banner-btn')?.addEventListener('click', () => {
                state.dismissedWelcomeBanner = true;
                debouncedSave();
            });

            document.querySelector('.resume-btn')?.addEventListener('click', () => {
                if (state.lastActiveMasterSetId) {
                    state.activeMasterSetId = state.lastActiveMasterSetId;
                    render();
                }
            });

            // Master sets homepage
            document.querySelectorAll('.open-set-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.activeMasterSetId = e.currentTarget.dataset.id;
                    state.lastActiveMasterSetId = state.activeMasterSetId;
                    debouncedSave();
                });
            });

            document.querySelector('.back-btn')?.addEventListener('click', () => {
                state.activeMasterSetId = null;
                render();
            });

            // New set
            document.querySelector('.new-set-btn')?.addEventListener('click', () => {
                state.showNewSetModal = true;
                render();
            });

            document.querySelector('.confirm-new-set')?.addEventListener('click', () => {
                const title = document.querySelector('.new-set-title').value.trim();
                const desc = document.querySelector('.new-set-desc').value.trim();
                const goal = document.querySelector('.new-set-goal').value;
                if (!title) {
                    showToast('Please enter a title');
                    return;
                }
                createMasterSet(title, desc, goal);
                state.showNewSetModal = false;
                render();
            });

            // Cancel modals
            document.querySelectorAll('.cancel-modal').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.showNewSetModal = false;
                    state.showImportModal = false;
                    state.showTrophyModal = false;
                    state.showBackupModal = false;
                    render();
                });
            });

            // Import
            document.querySelector('.import-btn')?.addEventListener('click', () => {
                state.showImportModal = true;
                render();
            });

            document.querySelector('.confirm-import')?.addEventListener('click', () => {
                const text = document.querySelector('.import-text').value || document.querySelector('.import-file').value;
                if (!text) {
                    showToast('Please paste or upload a file');
                    return;
                }
                // Basic CSV parsing - simplified for demo
                const lines = text.split('\n').filter(l => l.trim());
                const categories = {};
                let currentCat = 'General';
                
                lines.forEach(line => {
                    const parts = line.split(/[,\t|]/).map(p => p.trim());
                    if (parts.length >= 2) {
                        const last = parts[parts.length - 1];
                        const count = parseInt(last);
                        if (!isNaN(count) && count > 0) {
                            if (parts.length === 3) {
                                currentCat = parts[0];
                                if (!categories[currentCat]) categories[currentCat] = [];
                                categories[currentCat].push({ name: parts[1], count });
                            } else if (parts.length === 2) {
                                if (!categories[currentCat]) categories[currentCat] = [];
                                categories[currentCat].push({ name: parts[0], count });
                            }
                        }
                    }
                });

                const title = prompt('Enter Master Set title:') || 'Imported Set';
                const setId = createMasterSet(title);
                const masterSet = state.masterSets.find(m => m.id === setId);
                
                Object.entries(categories).forEach(([catName, sections]) => {
                    addCategory(setId, catName);
                    const cat = masterSet.categories[masterSet.categories.length - 1];
                    sections.forEach(sec => {
                        addSection(setId, cat.id, sec.name, sec.count);
                    });
                });

                state.showImportModal = false;
                state.activeMasterSetId = setId;
                render();
            });

            // Detail view controls
            document.querySelector('.section-filter-select')?.addEventListener('change', (e) => {
                state.sectionFilter = e.target.value;
                render();
            });

            document.querySelector('.section-sort-select')?.addEventListener('change', (e) => {
                state.sectionSort = e.target.value;
                render();
            });

            document.querySelectorAll('.section-view-toggle-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.sectionViewMode = e.target.dataset.view;
                    render();
                });
            });

            // Section controls
            document.querySelectorAll('.increment-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const { masterId: mid, catId: cid, secId: sid } = getDataIds(e.target);
                    incrementSection(mid, cid, sid);
                });
            });

            document.querySelectorAll('.decrement-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const { masterId: mid, catId: cid, secId: sid } = getDataIds(e.target);
                    decrementSection(mid, cid, sid);
                });
            });

            document.querySelectorAll('.plus-five-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const { masterId: mid, catId: cid, secId: sid } = getDataIds(e.target);
                    addDeltaSection(mid, cid, sid, 5);
                });
            });

            document.querySelectorAll('.complete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const { masterId: mid, catId: cid, secId: sid } = getDataIds(e.target);
                    const masterSet = state.masterSets.find(m => m.id === mid);
                    const cat = masterSet.categories.find(c => c.id === cid);
                    const sec = cat.sections.find(s => s.id === sid);
                    if (sec) addDeltaSection(mid, cid, sid, sec.total - sec.completed);
                });
            });

            // Inline edits
            document.querySelectorAll('.edit-section-name').forEach(el => {
                el.addEventListener('click', (e) => {
                    makeEditable(e.target, (newVal) => {
                        const { masterId: mid, catId: cid, secId: sid } = getDataIds(e.target);
                        editSection(mid, cid, sid, { name: newVal });
                    });
                });
            });

            document.querySelectorAll('.edit-section-completed').forEach(el => {
                el.addEventListener('click', (e) => {
                    makeEditableNumber(e.target, (newVal) => {
                        const { masterId: mid, catId: cid, secId: sid } = getDataIds(e.target);
                        editSection(mid, cid, sid, { completed: newVal });
                    });
                });
            });

            document.querySelectorAll('.edit-section-total').forEach(el => {
                el.addEventListener('click', (e) => {
                    makeEditableNumber(e.target, (newVal) => {
                        const { masterId: mid, catId: cid, secId: sid } = getDataIds(e.target);
                        editSection(mid, cid, sid, { total: newVal });
                    });
                });
            });

            document.querySelectorAll('.edit-category-name').forEach(el => {
                el.addEventListener('click', (e) => {
                    makeEditable(e.target, (newVal) => {
                        editCategory(e.target.dataset.masterId, e.target.dataset.catId, { name: newVal });
                    });
                });
            });

            document.querySelectorAll('.edit-master-title').forEach(el => {
                el.addEventListener('click', (e) => {
                    makeEditable(e.target, (newVal) => {
                        editMasterSet(e.target.dataset.id, { title: newVal });
                    });
                });
            });

            document.querySelectorAll('.add-section-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const masterId = e.target.dataset.masterId;
                    const categoryId = e.target.dataset.catId;
                    const name = prompt('Section name:');
                    if (!name) return;
                    const count = prompt('Number of questions:');
                    if (!count) return;
                    addSection(masterId, categoryId, name, parseInt(count));
                });
            });

            document.querySelectorAll('.add-category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const name = prompt('Category name:');
                    if (!name) return;
                    addCategory(state.activeMasterSetId, name);
                });
            });

            document.querySelectorAll('.delete-section-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (confirm('Delete this section?')) {
                        const { masterId: mid, catId: cid, secId: sid } = getDataIds(e.target);
                        deleteSection(mid, cid, sid);
                    }
                });
            });

            document.querySelectorAll('.delete-category-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (confirm('Delete this category?')) {
                        deleteCategory(e.target.dataset.masterId, e.target.dataset.catId);
                    }
                });
            });

            document.querySelector('.delete-set-btn')?.addEventListener('click', () => {
                if (confirm('Delete this master set?')) {
                    deleteMasterSet(state.activeMasterSetId);
                    state.activeMasterSetId = null;
                    render();
                }
            });

            document.querySelector('.sync-btn')?.addEventListener('click', () => {
                const masterSet = state.masterSets.find(m => m.id === state.activeMasterSetId);
                if (masterSet) {
                    editMasterSet(masterSet.id, { 
                        completedOverride: null, 
                        targetOverride: null 
                    });
                }
            });

            // Trophy room
            document.querySelectorAll('.open-trophy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.selectedTrophyId = e.currentTarget.dataset.id;
                    state.showTrophyModal = true;
                    render();
                });
            });

            document.querySelector('.goto-set-btn')?.addEventListener('click', () => {
                const trophy = state.unlockedTrophies.find(t => t.id === state.selectedTrophyId);
                if (trophy) {
                    state.activeMasterSetId = trophy.masterSetId;
                    state.activeTab = 'sets';
                    state.showTrophyModal = false;
                    render();
                }
            });

            document.querySelector('.trophy-search')?.addEventListener('input', (e) => {
                state.trophySearch = e.target.value;
                render();
            });

            document.querySelector('.rarity-filter-select')?.addEventListener('change', (e) => {
                state.rarityFilter = e.target.value;
                render();
            });

            document.querySelector('.set-filter-select')?.addEventListener('change', (e) => {
                state.setFilter = e.target.value;
                render();
            });

            document.querySelector('.trophy-sort-select')?.addEventListener('change', (e) => {
                state.trophySort = e.target.value;
                render();
            });

            document.querySelector('.trophy-group-select')?.addEventListener('change', (e) => {
                state.trophyGroupBy = e.target.value;
                render();
            });

            document.querySelectorAll('.trophy-view-toggle-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.trophyViewMode = e.target.dataset.view;
                    render();
                });
            });

            // Backup/Restore
            document.querySelector('.export-json')?.addEventListener('click', () => {
                const json = JSON.stringify(state, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `progress-tracker-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            });

            document.querySelector('.copy-json')?.addEventListener('click', () => {
                const json = JSON.stringify(state, null, 2);
                navigator.clipboard.writeText(json).then(() => showToast('Copied to clipboard!'));
            });

            document.querySelector('.restore-backup')?.addEventListener('click', () => {
                const json = document.querySelector('.restore-json').value;
                if (!json.trim()) {
                    showToast('Please paste JSON');
                    return;
                }
                try {
                    const restored = JSON.parse(json);
                    if (!Array.isArray(restored.masterSets)) {
                        showToast('Invalid backup format');
                        return;
                    }
                    state = restored;
                    localStorage.setItem(STATE_KEY, json);
                    state.showBackupModal = false;
                    showToast('✓ Backup restored!');
                    render();
                } catch (e) {
                    showToast('Invalid JSON');
                }
            });

            document.querySelector('.restore-file')?.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const json = await file.text();
                    document.querySelector('.restore-json').value = json;
                } catch (e) {
                    showToast('Failed to read file');
                }
            });
        }

        function makeEditable(el, onSave) {
            const original = el.textContent;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'inline-edit';
            input.value = original;
            el.replaceWith(input);
            input.focus();
            input.select();

            function save() {
                if (input.value.trim()) {
                    onSave(input.value.trim());
                }
            }

            input.addEventListener('blur', save);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') save();
                if (e.key === 'Escape') render();
            });
        }

        function makeEditableNumber(el, onSave) {
            const original = el.textContent;
            const input = document.createElement('input');
            input.type = 'number';
            input.className = 'inline-edit';
            input.value = original;
            el.replaceWith(input);
            input.focus();
            input.select();

            function save() {
                const val = parseInt(input.value) || 0;
                onSave(val);
            }

            input.addEventListener('blur', save);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') save();
                if (e.key === 'Escape') render();
            });
        }

        function getDataIds(el) {
            const target = el.closest('[data-master-id]');
            return {
                masterId: target.dataset.masterId,
                catId: target.dataset.catId,
                secId: target.dataset.secId
            };
        }

        // ========== INITIALIZATION ==========
        window.addEventListener('beforeunload', saveState);
        window.addEventListener('pagehide', saveState);
        window.addEventListener('visibilitychange', () => {
            if (document.hidden) saveState();
        });

        window.addEventListener('storage', (e) => {
            if (e.key === STATE_KEY) {
                state = JSON.parse(e.newValue);
                render();
            }
        });

        window.addEventListener('resize', resizeConfettiCanvas);
        resizeConfettiCanvas();

        // Auto-save timer
        setInterval(() => {
            render();
        }, 30000);

        // Initial render
        render();
    </script>
</body>
</html>
